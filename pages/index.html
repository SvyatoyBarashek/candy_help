<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Гильдия Кендируны</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <main class="main-page">

        <header class="site-hero">
            <p class="site-kicker">Гильдия Кендируны</p>
            <h1>Candy help</h1>
            <p class="site-subtitle">Выбери босса для открытия гайда</p>
        </header>

        <section class="boss-section">

            <div class="boss-grid">

                <button class="boss-card" data-boss-id="redVelvetDragon" aria-label="Red Velvet Dragon">
                    <img src="../images/Red_Velvet_Dragon_mirrored.png" alt="Red Velvet Dragon">
                    <span>Red Velvet Dragon</span>
                </button>

                <button class="boss-card" data-boss-id="machineGodOfTheEternalVoid" aria-label="Machine God of the Eternal Void">
                    <img src="../images/Machine-God_of_the_Eternal_Void_mirrored.png" alt="Machine God of the Eternal Void">
                    <span>Machine God of the Eternal Void</span>
                </button>

                <button class="boss-card" data-boss-id="livingLicoriceAbyss" aria-label="Living Licorice Abyss">
                    <img src="../images/Living_Licorice_Abyss_mirrored.png" alt="Living Licorice Abyss">
                    <span>Living Licorice Abyss</span>
                </button>

                <button class="boss-card" data-boss-id="avatarOfDestiny" aria-label="Avatar of Destiny">
                    <img src="../images/Avatar_of_Destiny_mirrored.png" alt="Avatar of Destiny">
                    <span>Avatar of Destiny</span>
                </button>

            </div>

        </section>

        <footer class="guild-footer">
            <h2>Гильдия Кендируны</h2>

            <p>Разработчики:</p>

            <ul>
                <li>Код: @SvyatoyBarashek</li>
                <li>Дизайн: @Rikodoru</li>
            </ul>

            <p>Обращаться с идеями и исправлением ошибок к ним!</p>
        </footer>

    </main>

    <script src="../js/main.js"></script>
</body>
</html>
